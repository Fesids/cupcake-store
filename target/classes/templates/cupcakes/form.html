<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<div layout:fragment="content">

  <h2 th:text="${cupcake.id} == null ? 'Novo Cupcake' : 'Editar Cupcake'"></h2>
  <form th:action="${cupcake.id} == null ? @{/cupcakes} : @{/cupcakes/{id}(id=${cupcake.id})}" method="post">
    <label>Nome<input name="name" th:value="${cupcake.name}" required/></label><br/>
    <label>Descrição<textarea name="description" th:text="${cupcake.description}"></textarea></label><br/>
    <label>Preço<input name="price" th:value="${cupcake.price}" required/></label><br/>
    <button type="submit">Salvar</button>
  </form>
</div>
</html>
